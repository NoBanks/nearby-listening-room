<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="A seated, hands-only listening room for the music of NoBanks Nearby." />
    <link rel="icon" href="data:," />
    <title>Nearby Listening Room</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07060a; overflow: hidden; }
      #landing {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 28px; padding: 24px; text-align: center;
        background: radial-gradient(ellipse at 50% 70%, rgba(40,22,12,0.86), rgba(5,4,8,0.97) 70%);
        color: #f4d6a8; font-family: Georgia, 'Times New Roman', serif;
        transition: opacity 0.9s ease;
      }
      #landing.gone { opacity: 0; pointer-events: none; }
      h1 { margin: 0; font-weight: 400; font-size: clamp(30px, 6vw, 58px); letter-spacing: 0.02em; }
      p { margin: 0; font-size: clamp(15px, 2.2vw, 20px); color: #b59a7c; font-style: italic; }
      .row { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
      button {
        font: inherit; font-size: 20px; padding: 16px 36px; border-radius: 999px; cursor: pointer;
        border: 1px solid #c79a62; background: #e0a765; color: #1a0f07; min-height: 56px;
      }
      button.ghost { background: transparent; color: #e6c79c; }
      button:disabled { opacity: 0.4; cursor: wait; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body style="margin: 0">
    <div id="scene-container"></div>
    <div id="landing">
      <h1>Nearby Listening Room</h1>
      <p>Sit down. Bring your hands. The music of NoBanks Nearby.</p>
      <div class="row">
        <button id="enter" disabled>Enter the room</button>
        <button id="flat" class="ghost" disabled>Listen on this screen</button>
      </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
